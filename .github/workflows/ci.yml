name: CI

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
    branches: [master]

# A branch with an open PR fires both `push` and `pull_request` for the
# same commits — this doesn't eliminate that (push and pull_request use
# different refs, so they can't be coalesced into one run), but it does
# cancel a stale run for the same ref when a new one starts, so rapid
# pushes to one branch don't queue up redundant runs behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan full diff range against base
        run: |
          git diff --name-only --diff-filter=ACM "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"...HEAD > /tmp/changed-files.txt || true
          node scripts/security/scan-secrets.js --files-from /tmp/changed-files.txt

  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit & crypto KAT tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
